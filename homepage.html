<!DOCTYPE html>
<html lang="en">

  <head>
    <!--Standard browser formatting-->
    <meta charSet="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--Title and description-->
    <title>Rachel Jorgensen | Copywriter and narrative strategist for outdoor and lifestyle brands</title>   
    <meta name="description" content="The personal website of Rachel Jorgensen" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet" />

    <!--CSS styling global fonts-->
    <style>
      :root {
        --display-font: "Boldonse", sans-serif;
        --body-font: "Figtree", sans-serif;
      }

      body {
        font-family: var(--body-font);
      }

      h1, h2, h3, .font-display {
        font-family: var(--display-font);
      }

      p, .font-body {
        font-family: var(--body-font);
      }
    </style>

    <!--Open graph (Facebook, Linkedin, Slack etc) improved handling-->
    <meta property="og:title" content="Rachel Jorgensen | Copywriter and narrative strategist for outdoor and lifestyle brands" />
    <meta property="og:description" content="The personal website of Rachel Jorgensen" />
    <meta property="og:url" content="https://racheljorg.com" />
    <meta property="og:site_name" content="RJ" />
    <meta property="og:image" content="https://racheljorg.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />

    <!--Twitter improved handling-->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rachel Jorgensen | Copywriter and narrative strategist for outdoor and lifestyle brands" />
    <meta name="twitter:description" content="The personal website of Rachel Jorgensen" />
    <meta name="twitter:image" content="https://rahceljorg.com/og.png" />

    <!--Add Google analytics tag management later, here (googletagmanager.com)-->
    
    <!--Set icon for brower tab-->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!--Browser tab color-->
    <meta name="theme-color" content="#1769E8" />

    <!--This is the canon site-->
    <link rel="canonical" href="https://racheljorg.com" />



  </head>

<!--CSS styling-->
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "DM Sans", sans-serif;
    background: #f6eedf;
    color: #111111;
  }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #99B5D8;
    border-bottom: 4px solid #111111;
  }

  .hero-section {
    width: 100%;
    background: #99B5D8;
    color: #f6eedf;
}

  .hero-layout {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    align-items: center;
    gap: 64px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  .hero-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
  }

  .eyebrow {
    background: #f6eedf;
    border: 3px solid #111111;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    line-height: 1.4;
    color: #111111;
  }

  .hero-title {
    margin: 0;
    font-family: "Figtree", sans-serif;
    font-size: clamp(2.5rem, 7vw, 5rem);
    line-height: 1.05;
    color: #f6eedf;
  }

  .hero-text {
    margin: 0;
    max-width: 32rem;
    font-size: 1.2rem;
    line-height: 1.7;
    color: #0000;
  }

  .primary-button {
    display: inline-block;
    background: #E56750;
    color: #111111;
    text-decoration: none;
    font-weight: 700;
    padding: 14px 24px;
    border: 3px solid #111111;
    border-radius: 10px;
    box-shadow: 4px 4px 0 #111111;
  }

  .logo-visual {
    position: relative;
    width: 420px;
    max-width: 100%;
    margin: 0 auto;
  }

  .image-frame {
    position: relative;
    z-index: 2;
    background: #f6eedf;
    border: 5px solid #111111;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 10px 10px 0 #111111;
  }

  .image-frame img {
    display: block;
    width: 100%;
    height: auto;
  }

  .shape {
    position: absolute;
    pointer-events: none;
    z-index: 3;
    opacity: 0.95;
  }


  @media (max-width: 800px) {
    .logo-layout {
      grid-template-columns: 1fr;
    }

    .logo-copy {
      align-items: center;
      text-align: center;
    }
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .brand {
    font-size: 2rem;
    color: #F6EEDF;
    text-decoration: none;
    letter-spacing: 0.04em;
  }

  .main-nav {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .main-nav a {
    color: #F6EEDF;
    text-decoration: none;
    font-weight: 700;
  }

  .cta {
    display: inline-block;
    background: #99B5D8;
    color: #111111;
    text-decoration: none;
    font-weight: 700;
    padding: 12px 18px;
    border: 3px solid #111111;
    border-radius: 8px;
    box-shadow: 4px 4px 0 #111111;
  }

  @media (max-width: 700px) {
    .main-nav {
      display: none;
    }
    .header-inner {
      justify-content: space-between;
    }
  }

    .logo-marquee {
    overflow: hidden;
    white-space: nowrap;
    background: #ffff;
    padding: 20px 0;
  }

  .logo-marquee-track {
    display: flex;
    align-items: center;
    min-width: max-content;
    white-space: nowrap;
    animation: marquee 30s linear infinite;
  }

  .logo-marquee-content {
    display: flex;
    align-items: center;
    gap: 4rem;
    padding-right: 4rem;
  }

  .logo-marquee-content img {
    height: 50px;
    width: auto;
    flex-shrink: 0;
  }

  @keyframes marquee {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(-50%);
    }
  }

.what-we-do {
  background: #f6eedf;
  padding: 80px 24px;
}

.what-we-do h2 {
  max-width: 700px;
  margin: 0 0 16px;
  font-family: "Archivo Black", sans-serif;
  font-size: clamp(2.2rem, 4vw, 4rem);
  line-height: 1.1;
}

.what-we-do > p {
  max-width: 700px;
  margin: 0 0 32px;
  font-size: 1.1rem;
  line-height: 1.7;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}

.card {
  background: #f6eedf;
  border: 3px solid #111111;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 6px 6px 0 #111111;
}

.card-yellow { background: #F5B83C; }
.card-red { background: #E56750; }
.card-teal { background: #7AE7D5; }
.card-lime { background: #C8E832; }


</style>
